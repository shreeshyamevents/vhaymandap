services:
  - type: web
    name: vyahmandap-marketplace
    runtime: python
    repo: https://github.com/shreeshyamevents/vhaymandap
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vyahmandap-db
          property: connectionString
